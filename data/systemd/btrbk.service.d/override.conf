[Unit]
ConditionPathIsMountPoint=/mnt/btrfs
ConditionPathIsMountPoint=/mnt/backup

[Service]
Type=oneshot
# A large first backup can run many hours, and a paused run can sit frozen for
# as long as the operator likes; a wall-clock start timeout would kill it just
# for waiting. Stop is explicit (button/tray) rather than timeout-driven.
TimeoutStartSec=infinity
# Best-effort, not idle: `IOSchedulingClass=idle` only lets the backup write to
# the (slow USB) disk when nothing else wants it, which is a large part of why
# a full send crawls. We still keep a mild nice for CPU, which is not the
# bottleneck here (btrfs send/receive are single-threaded; the disk is).
Nice=5
IOSchedulingClass=best-effort
IOSchedulingPriority=4
# Run through the helper so it can publish live progress (bytes/percent) to
# /run/time-portal/progress.json while btrbk works.
ExecStart=
ExecStart=/usr/lib/time-portal/time-portal-helper run-backup
ExecStartPre=/usr/lib/time-portal/time-portal-helper backup-esp
ExecStartPost=/usr/lib/time-portal/time-portal-helper write-manifest --target /mnt/backup/portal
