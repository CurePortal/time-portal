[Unit]
ConditionPathIsMountPoint=/mnt/btrfs
ConditionPathIsMountPoint=/mnt/backup

[Service]
Type=oneshot
TimeoutStartSec=24h
Nice=10
IOSchedulingClass=idle
# Run through the helper so it can publish live progress (bytes/percent) to
# /run/time-portal/progress.json while btrbk works.
ExecStart=
ExecStart=/usr/lib/time-portal/time-portal-helper run-backup
ExecStartPre=/usr/lib/time-portal/time-portal-helper backup-esp
ExecStartPost=/usr/lib/time-portal/time-portal-helper write-manifest --target /mnt/backup/portal
