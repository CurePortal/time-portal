# Time Portal — btrfs snapshot + incremental send/receive.
#
# Ordering matters: a `target` line starts a target section and everything after
# it is parsed in that context, where snapshot_* options are rejected. So all
# snapshot retention goes before the first `target`.

timestamp_format long-iso
transaction_log /var/log/btrbk.log
lockfile /var/run/btrbk.lock

volume /mnt/btrfs
  snapshot_dir btrbk_snapshots

  # local snapshots (cheap, COW)
  snapshot_preserve_min 1d
  snapshot_preserve 24h 7d

  target /mnt/backup/portal
    # off-disk versions — Time Portal cadence
    target_preserve_min 1w
    target_preserve 24h 30d 12m 3y

  subvolume @
  subvolume @home

  # not included: @log, @pkg (re-creatable), /boot (vfat, mirrored separately)
