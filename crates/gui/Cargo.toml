[package]
name = "timeportal-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "time-portal"
path = "src/main.rs"

[dependencies]
glib = "0.22.10"
gtk4 = "0.11.5"
libadwaita = { version = "0.9.2", features = ["v1_2", "v1_4", "v1_5"] }
libc = "0.2.190"
serde_json.workspace = true
serde.workspace = true
timeportal-core = { version = "0.1.0", path = "../core" }
ksni = { version = "0.3.6", features = ["blocking"] }
