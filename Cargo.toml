[workspace]
resolver = "2"
members = ["crates/core", "crates/helper", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["cure"]
repository = "https://github.com/cure/time-portal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
